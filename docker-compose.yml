version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: managementsystem__db
    environment:
      POSTGRES_DB: management_system_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - management_network
volumes:
  postgres_data:
    driver: local

networks:
  management_network:
    driver: bridge